version: '3.8'
services:
  runner:
    image: docker:24.0-cli
    command: sleep infinity
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: 1
      DOCKER_CERT_PATH: /certs/client
    volumes:
      - shared-certs:/certs
    depends_on:
      - docker
    networks:
      - ci-net

  docker:
    image: docker:24.0-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - shared-certs:/certs
    networks:
      - ci-net

volumes:
  shared-certs:

networks:
  ci-net:
