version: '3.8'
services:
  app:
    build: ./app
    ports:
      - "3000:3000"
    environment:
      S3_ENDPOINT: storage
      S3_ACCESS_KEY: admin_user
      S3_SECRET_KEY: admin_password
      REDIS_HOST: cache
    depends_on:
      - storage
      - cache
    networks:
      - storage-net

  storage:
    image: minio/minio:RELEASE.2023-05-18T00-15-31Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin_user
      MINIO_ROOT_PASSWORD: admin_password
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - storage-net

  cache:
    image: redis:7-alpine
    networks:
      - storage-net

volumes:
  minio-data:

networks:
  storage-net:
