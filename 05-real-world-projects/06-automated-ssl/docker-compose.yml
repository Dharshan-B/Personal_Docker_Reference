version: '3.8'
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - cert-vol:/etc/letsencrypt
      - web-root:/var/www/html
    networks:
      - sec-net

  certbot:
    image: certbot/certbot
    volumes:
      - cert-vol:/etc/letsencrypt
      - web-root:/var/www/html
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - sec-net

volumes:
  cert-vol:
  web-root:

networks:
  sec-net:
