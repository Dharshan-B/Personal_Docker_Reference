events {}
http {
    server {
        listen 80;
        server_name example.com www.example.com;

        # Webroot path for Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # SSL Config (commented out until certificates exist!)
    # server {
