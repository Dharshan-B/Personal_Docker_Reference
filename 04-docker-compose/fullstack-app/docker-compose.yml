version: '3.8'

# Full Stack App: PostgreSQL + Backend API + Frontend
# Run: docker compose up -d
# Frontend: http://localhost:8080
# Backend API: http://localhost:3000

services:

  # ── Database ───────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: fullstack-db
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret123}   # reads from .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d myapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Backend API ─────────────────────────────────────────────────
  backend:
    build: ./backend                    # Build from ./backend/Dockerfile
    container_name: fullstack-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://admin:${DB_PASSWORD:-secret123}@db:5432/myapp
      NODE_ENV: development
      PORT: 3000
    networks:
      - backend-network
      - frontend-network
    depends_on:
      db:
        condition: service_healthy      # Wait until DB is actually ready
    restart: unless-stopped

  # ── Frontend ────────────────────────────────────────────────────
  frontend:
    build: ./frontend                   # Build from ./frontend/Dockerfile
    container_name: fullstack-frontend
    ports:
      - "8080:80"
    networks:
      - frontend-network
    depends_on:
      - backend
    restart: unless-stopped

# ── Volumes ─────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────────
networks:
  backend-network:
    driver: bridge
  frontend-network:
    driver: bridge
