<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🐳 Docker Compose Demo</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
    }
    h1 { color: #58a6ff; font-size: 2.5rem; }
    p { color: #8b949e; }
    .badge {
      background: #1f6feb;
      padding: 8px 20px;
      border-radius: 20px;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🐳 Hello from Docker Compose!</h1>
  <p>This page is served by nginx running inside a Docker container.</p>
  <div class="badge">✅ Compose is working!</div>
</body>
</html>
